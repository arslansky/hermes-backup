vms:
  zeabur-01:
    hostname: VM-17-222-ubuntu
    tailnet_ip: 100.121.1.3
    ssh_alias: zeabur          # 由 Oracle ~/.ssh/config 定義
    ssh_user: ubuntu
    ssh_port: 22
    roles:
      - openclaw-main
      - telegram
      - primary
    description: Main OpenClaw host（6 個 TG bot）+ gateway 18789 + serve 8443
    scripts_dir: /home/ubuntu/hermes-backup
    backup_priority: 1

  oracle-01:
    hostname: instance-20260703-2144
    tailnet_ip: 100.96.203.104
    ssh_alias: oracle          # 本機
    ssh_user: opc
    ssh_port: 22
    roles:
      - hermes
      - openclaw
      - backup
      - last-line-maintainer
    description: Hermes Agent（本機，designated 最後維修者）
    scripts_dir: /home/opc/hermes-backup
    backup_priority: 2

  zo-01:
    hostname: modal
    tailnet_ip: null           # 未加入 tailnet（公網 VM）
    ssh_alias: zo
    ssh_host: ts8.zocomputer.io
    ssh_user: root
    ssh_port: 10661
    ssh_key: zeabur_key
    roles:
      - zo-vm
    description: Zo Computer VM（managed service, gvisor kernel）
    scripts_dir: /root/hermes-backup
    backup_priority: 3

# 注意：公網 IP（161.118.247.199 / 43.156.247.30）已淘汰（2026-09-14 tailnet 化）。
# 網絡詳情一律睇 setup-guide/TAILSCALE-MESH-SETUP.md

# Roles
#   openclaw-main  — OpenClaw 主機
#   hermes         — Hermes Agent
#   telegram       — Telegram bot
#   backup         — 備份來源
#   primary        — 最高 backup 優先級
#   zo-vm          — Zo Computer VM
#   last-line-maintainer — Hermes（Oracle）係全網最後維修者

# SSH 連接（2026-09-17 現況，全部由 Oracle）
#   Oracle → Zeabur: ssh zeabur        (tailnet 100.121.1.3)
#   Oracle → ZO:     ssh zo            (公網 ts8.zocomputer.io:10661)
#   兩邊 → GitHub:   HTTPS with GITHUB_TOKEN
